# config/skill_display.yml -- how a skill token is shown on a resume, and under which heading.
#
# Read by hiredra/resume/skills.py, which builds the resume's skills section in code (never by a model). Only the
# owner's Strong and Working skills are ever printed; this table only says how to group and spell them. A token not
# listed here goes under the category its keyword rules pick (see `fallback`), spelled as the token with hyphens as
# spaces. The category order here is the order on the page.

categories:
  - Languages
  - AI / LLM
  - ML / NLP
  - Backend
  - Infra & Tools

# token -> category. Tokens are the master profile's spellings (lower case, hyphens).
