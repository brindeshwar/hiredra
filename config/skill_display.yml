# Tokens never printed in the skills section: broad practices that read as filler in a skills list (they still count
# for matching and may appear in bullets).
hide: [
  data-structures, algorithms, testing, unit-testing, technical-writing, documentation, debugging, error-handling,
  code-review, concurrency, security, reproducibility, experiment-design, architecture-decision-records,
  contract-testing, fault-injection-testing, queueing-theory, lyapunov-optimization, mobile-edge-computing,
  simulation, desktop-development, data-cleaning, statistics, zero-shot-classification, multimodal, generative-ai,
  ai-safety, application-security, supply-chain-security, object-oriented-programming, data-ingestion,
  neural-networks, fine-tuning, data-visualization
]

# Keyword rules for a token not listed under `category`: the first rule whose word appears in the token wins.
fallback:
  - {category: AI / LLM, words: [llm, agent, prompt, rag, embedding, vector, gpt, genai]}
  - {category: ML / NLP, words: [learning, neural, nlp, vision, model, data, classification]}
  - {category: Backend, words: [api, database, server, backend, auth, sql, queue]}
  - {category: Infra & Tools, words: []}
