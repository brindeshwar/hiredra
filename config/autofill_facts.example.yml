# Never put here (the loader refuses the whole file if you do; these are always yours to answer in the form):
# work authorization, visa or sponsorship, salary / CTC / compensation, gender, race, ethnicity, caste, religion,
# disability, veteran status, date of birth or age, passport or any government ID, and any password.

