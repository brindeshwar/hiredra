# config/skill_aliases.yml -- owner-editable STARTER list of abbreviations and
# renames that embeddings can't reach (cosine for k8s ~ kubernetes is far below
# any safe threshold).  Format:   canonical: [alias, ...]
#
# * The canonical spelling below is the more common one in the harvested market
#   vocabulary (by document frequency) unless noted; change it freely.
# * An alias that is not a node yet (k8s, js, ts ...) is still recorded, so when
#   real job descriptions use it, Step 3 extraction resolves it with NO embedding.
# * Nothing here changes the database by itself: entries show up in the merge
#   dry-run as their own band and are applied only by `merges --apply`.
# * Strict: an alias under two canonicals, a self-alias, or a name that is both a
#   canonical and an alias is an error.
#
# These are starter entries chosen conservatively -- delete anything you disagree
# with. Deliberately NOT included (ambiguous): ai, ci, ux. ("node" was added on
# 2026-10-25 by owner decision: in job skill lists it means Node.js.)

aliases:
  kubernetes: [k8s]
  javascript: [js, es6]
  typescript: [ts]
  go: [golang]
  gcp: [google cloud platform, google cloud]   # "google cloud" is loose; drop it if you prefer
  azure: [microsoft azure]
  aws: [amazon web services]
  generative ai: [genai]
  llm: [large language models, large language models (llm), large language model]
  machine learning: [ml]
  natural language processing: [nlp]
  sre: [site reliability engineering]
  vue: [vue.js, vuejs]
  node.js: [nodejs, node]
  react: [react.js, reactjs]
  c#: [csharp]
  mongodb: [mongo]
  scikit-learn: [sklearn]
  postgresql: [postgres]
  ci/cd: [cicd, continuous delivery]
  # Short/long forms of the owner's own skills that embeddings score low (owner review 2026-10-25,
  # data/merge-review-short-forms-2026-10-25.md). The cosine is today's similarity.
  mcp: [model context protocol, mcps]                    # 0.57 / 0.75
  rag: [retrieval augmented generation]                  # 0.67
  named entity recognition (ner): [ner]                  # 0.70
  s3: [amazon s3]                                        # 0.72
  transformers: [hugging face transformers]              # 0.78
  ec2: [amazon ec2]                                      # 0.80
  gemini: [google gemini]                                # 0.85
  # Separate nodes that freehire's dictionary calls one skill (owner review 2026-10-30,
  # data/merge-review-freehire-2026-10-29.md). The cosine is today's similarity.
  angular: [angularjs]                                   # 0.84
  api: [apis]                                            # 0.81
  azure data factory: [data factory]                     # 0.79
  c: [c programming]                                     # 0.79
  claude: [anthropic claude]                             # 0.73
  css: [css3]                                            # 0.70
  data modeling: [data modelling]                        # 0.81
  .net: [.net core]                                      # 0.76
  express.js: [express]                                  # 0.98
  google analytics: [ga4]                                # 0.54
  html: [html5]                                          # 0.71
  apache iceberg: [iceberg]                              # 0.78
  object-oriented programming: [object-oriented design, oop]   # 0.85 / 0.78
  pl/sql: [plsql]                                        # 1.00
  power bi: [powerbi]                                    # 1.00
  ruby on rails: [rails]                                 # 0.82
