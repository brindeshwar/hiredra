# config/companies.yml — the Path-1 company list (hand-edited, owner-controlled).
# Each entry maps to a hiredra.sourcing.CompanyEntry. See docs/sourcing.md §7.5.
#
#   name         required — becomes Job.company verbatim (review batch / dashboard).
#   careers_url   public board URL; the provider is auto-detected from it.
#   slug / api    alternatives to careers_url (slug -> extra["slug"]).
#   provider      pin a provider explicitly (skips detection): greenhouse|lever|ashby
#   enabled       set false to skip an entry without deleting it.

companies:
  - name: Stripe
    slug: stripe
    provider: greenhouse       # Stripe's careers page is on stripe.com, not
                               # *.greenhouse.io, so auto-detect can't fire
  - name: Ramp
    slug: ramp
    provider: ashby
  - name: Linear
    slug: linear
    provider: ashby
  - name: Vercel
    slug: vercel
    provider: ashby
  - name: OpenAI
    slug: openai
    provider: ashby
  - name: Leverdemo
    careers_url: https://jobs.lever.co/leverdemo
