# config/extraction.yml -- Step 3 (skill extraction) tunables.
# Owner-editable; the parsing/preprocessing engine itself stays code, same
# split as config/filters.yml's ALLOW/BLOCK lists vs their matcher.

# Below this many characters of PREPROCESSED JD text (after boilerplate/
# footer stripping, backslash-unescaping, blank-line collapse -- see
# hiredra/extraction.py's preprocess()), skip the LLM call entirely: mark
# the job extraction_confidence=low with a "skipped-thin" note, keep it at
# status='extracted' for review, never drop it. Characterization sample's
# thinnest genuinely-real JD was 184 raw chars; 200 sits just above that.
min_description_chars: 200

# Gemini free-tier pacing (gemini-3.5-flash-lite): 15 RPM. A plain minimum
# gap between calls, not a token-bucket/learned-rate scheme -- see
# hiredra/extraction.py's _pace().
requests_per_minute: 15

# Gemini free-tier daily cap for this model, and the share of it we allow ourselves.
# The daily counter (the api_usage table) stops a run at
# requests_per_day x headroom = 450, before Google's own cap. Every flash-lite
# agent shares that counter, because Google meters the model, not the stage.
requests_per_day: 500
headroom: 0.90

# --- Guards (hiredra.extraction.apply_guards) ---------------------------------
# The model reads; code enforces the rules (CLAUDE.md rule 3). After every extraction, a skill is
# dropped when the JD never names it (or a synonym below), when it is on the generic list, or when
# it has more than max_skill_words words (a description, not a name). Then at most max_skills are
# kept, required ones first. Every drop is noted on the job. Changing anything here changes the
# extraction stamp; `python -m hiredra.extraction --reguard` re-applies it to stored jobs, free.
max_skills: 25
max_skill_words: 4
generic_skills: [
  ai, ml, cloud, data, software, programming, coding, engineering, development,
  software development, software engineering, backend software engineering,
  backend, frontend, full-stack, full stack, infrastructure, testing, debugging, troubleshooting,
  monitoring, alerting, metrics, logging, documentation, deployment, collaboration, communication,
  teamwork, leadership, problem solving, ownership, safety, tone, latency, performance
]
# --- Dictionary producer (hiredra.extraction.dictionary_extras, decision D10.3) -----------------
# freehire's skill dictionary runs after the LLM and adds the skills the LLM did not list, as
# good_to_have. It skips the generic_skills above and this list: umbrella words the dictionary tags
# on most postings, and office tools / compliance names that are rarely the job's requirement
# (the step-9 comparison's two noise groups).
dictionary_skip: [
  api, automation, analytics, agile, saas, machine learning, data science, llm, agentic ai,
  generative ai, networking, iot, observability, devops, data engineering,
  asana, notion, slack, zoom, jira, confluence, gdpr, hipaa, soc 2, iso 27001, github,
  google workspace, microsoft office, excel, statistics, user research, openai, anthropic,
  # industries and business functions, not skills (owner, 2026-10-31)
  fintech, cryptocurrency, crm, business development
]
# --- Skill-name cleaning (hiredra.vocab.Resolver; owner decisions 2026-11-12) ---------------------
# Every skill name is cleaned before it is stored: lists are split ("docker & kubernetes"), versions and
# same-spelling variants become aliases of a known skill ("angular 7" -> angular, "java script" ->
# javascript). Names here are never split or version-stripped: they are one skill as written. The
# never-merge pairs in config/skill_never_merge.yml are respected too. Not part of the extraction stamp.
keep_whole: [
  ci/cd, pl/sql, tcp/ip, ui/ux, a/b testing, pub/sub, i/o, http/https, r&d, research and development,
  trust and safety, trust & safety, weights & biases, weights and biases, stm32, web3, web 3.0,
  do-178b/c, rtca do-178b/c
]
# --- The describe step (hiredra.graph.describe; owner decisions D2, D6, 2026-11-12) -------------------
# Every new skill is described by gemini-3.5-flash-lite and checked against its 5 nearest known skills
# ("is it one of these under another name?"). It shares the flash-lite meter above with extraction:
# at most max_requests_per_day requests a day for describing, and never into the last `reserve`
# requests of the shared 450, which stay for extraction. A "same as" answer is applied only when the
# names allow it; one way is the same words plus these filler words only ("mcp server" -> mcp).
describe:
  max_requests_per_day: 60
  reserve: 50
  fillers: [
    server, servers, tool, tools, tooling, system, systems, framework, frameworks, library, libraries,
    platform, platforms, programming, language, sdk, api, apis, js, integration, integrations, ecosystem,
    stack, fundamentals, concepts, basics, skills, experience, technology, technologies, services, protocol
  ]

# canonical name -> other names that count as "the JD names it"
skill_synonyms:
  gcp: [google cloud, google cloud platform]
  google cloud: [gcp]
  aws: [amazon web services]
  azure: [microsoft azure]
  kubernetes: [k8s, kubenetes]
  k8s: [kubernetes]
  golang: [go]
  go: [golang]
  postgresql: [postgres]
  postgres: [postgresql]
  javascript: [js]
  typescript: [ts]
  nodejs: [node.js, node]
  node.js: [nodejs, node]
  llm: [large language model, llms]
  llms: [large language models, llm]
  machine learning: [ml]
  aws bedrock: [amazon bedrock, bedrock]
  amazon bedrock: [aws bedrock, bedrock]
  a/b testing: [a/b test, ab test]
  ci/cd: [ci cd, continuous integration, continuous delivery]

# --- Fallback provider (docs/model-selection-extraction.md) ---------------------------------
# When Gemini's daily budget is spent, the same run continues on this model for the remaining jobs.
# `python -m hiredra.extraction --provider nvidia` forces it (big re-runs). The owner accepted
# NVIDIA's API trial terms for this use (docs/decisions.md). Key: NVIDIA_API_KEY in .env.
# One call at a time, paced under requests_per_minute x headroom, each with a timeout; retries use
# the owner's rule (1, 2, 4, 8 s + jitter). NVIDIA states no daily cap: requests_per_day is our own
# guard rail and a visible count (the api_usage table).
fallback:
  provider: nvidia
  model: nvidia/nemotron-3.5-super-vl-120b-a12b
  base_url: https://integrate.api.nvidia.com/v1
  requests_per_minute: 40
  headroom: 0.90
  requests_per_day: 10000      # the owner's guard (2026-11-11)
  count_errors: false          # a request counts once NVIDIA accepts it, not when it fails (429, 5xx, no answer)
  timeout_seconds: 120
  max_tokens: 4096
