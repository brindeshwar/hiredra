# config/scoring.yml — a scoring sourcing run. See docs/sourcing.md §9.5.
# Loading is STRICT: an unknown key anywhere (including nested sections) is an error.

kind: scoring
# Which boards to crawl, by provenance: the boards table (D2.1), filled from config/companies.yml by
# `python -m hiredra.sourcing boards import config/companies.yml`. `all` = every pending/active board.
boards: [curated]

pacing:
  between_companies: 1.0      # base seconds between company fetches
  jitter: 0.5                 # + up to this many random seconds (one worker only)
  workers: 48                 # tasks in flight (D4.1). Enough for every line's share at once (Workday 10 per data
                              # centre, Eightfold 6, Phenom 2, JobSpy 1, the rest): with 16, Workday got only 10 (crawl 4).
                              # Most of them wait on a pace, which costs nothing. Past 1, http.per_host paces a host

http:
  timeout: 15.0
  cooldown_seconds: 900.0     # default block cooldown (ATS hosts): 15 min
  proxy: null                 # OFF (docs/decisions.md #20)
  per_host: 2                 # requests in flight to one host at once (D4.2)
  host_limits:                # measured 2026-11-02: 4 on these held, 150 boards in 61 s, no 429
    boards-api.greenhouse.io: 4
    api.lever.co: 4
    api.ashbyhq.com: 4
    eightfold.ai: 6             # ONE set of slots for every *.eightfold.ai tenant (2026-11-03: 14 of 30 refused
                                # at 8 at once, unpaced); the belt paces them all to ~2.2/s, 6 in flight

belt:                         # the conveyor belt (owner's plan, 2026-11-07): each platform held to `fill` of its
  fill: 0.6                   # measured limit, so the limit is never reached and nothing is refused
  tries: 4                    # a refused task goes back on the belt, at most this many times in a run
  watchdog_minutes: 10        # warn when no task has finished for this long
  status_minutes: 10          # a status line in the crawl log: in flight per platform, left, saves waiting
  platforms:                  # limit: requests/s where refusals start; at_once: its tasks in flight together
    workday: {limit: 10.0, at_once: 10, per_data_centre: true}  # PER data centre (wd1, wd5...): measured
                                          # 2026-11-08, one refused at ~12/s (clean at 9); four together took
                                          # 16.6/s with no refusal. 6/s each; a reply ~0.9 s, so 10 at once
    eightfold: {limit: 3.6, at_once: 6}   # ONE limit across our IP: measured 2026-11-08, 3.6/s over 4 sites
                                          # clean, 8/s throttled (405) in 29 s. 3.6 = the highest rate measured
                                          # clean, so 60% = ~2.2/s for all of Eightfold; a reply ~0.5 s
    phenom: {limit: 1.0, at_once: 2}      # ~1/s for every site (freehire: 403s past it); ~2 s a request

jobspy:
  sites: [indeed, linkedin]     # google OFF (M0.2, 2026-10-17): 0 rows on 4 query phrasings
  country_indeed: India
  linkedin_fetch_description: true
  between_sites_delay: 3.0
  cooldown_short: 1800.0      # LinkedIn / Indeed / Google block -> 30 min
  cooldown_long: 21600.0      # Glassdoor / Naukri block -> 6 h

  # Every site except LinkedIn uses this broad query.
  default_query:
    search_terms:
      - AI Engineer
      - Machine Learning Engineer
      - LLM Engineer
      - Generative AI Engineer
      - Backend Engineer
      - Python Developer
      - Data Engineer
      - Software Engineer
    location: India
    hours_old: 336            # 14 days (Track 1 default)
    results_per_site: 100     # per term: Indeed 8 x 100 = up to 800 rows (M0.2)
    # To retry Google later: add it to `sites` and set `google_search_term` (one full query string).

  # LinkedIn's ~10-page budget: fewer terms, full-time, tighter window.
  linkedin_query:
    search_terms:
      - AI Engineer
      - LLM Engineer
      - Machine Learning Engineer
      - Backend Engineer
    job_type: fulltime
    hours_old: 168            # 7 days
    results_per_site: 50      # per term, + 1 description request each; LinkedIn throttles past a
                              # few hundred per IP. A block is fail-soft (30-min cooldown).

path2:
  enabled: false              # Path-2 discovery slot (not implemented)
