# config/skill_never_merge.yml -- owner-editable list of skill pairs that look
# alike but are DIFFERENT skills. They are never proposed by `merges`, in any
# band, on any future run (so a rejected pair doesn't come back every time).
# Format: a list of two-name pairs; order doesn't matter.
#
# Starter entries: pairs from the first real dry-run that are clearly distinct.
# Edit freely.

never_merge:
  - [sql, sql server]
  - [react, react native]
  - [machine learning, deep learning]
  - [devops, azure devops]
  - [gitlab, gitlab ci]
  - [observability, data observability]
  - [vector databases, vector embeddings]
  - [data security, data privacy]
  - [c, c++]
  - [c, c#]
  - [c++, c#]
  # Same spelling once a plural "s" is folded, but different skills (graph audit, 2026-11-12). Name cleaning at
  # extraction (hiredra.vocab) reads this list too.
  - [ada, adas]          # the Ada language / advanced driver-assistance systems
  - [canva, canvas]      # the design tool / the HTML canvas
  - [ssr, ssrs]          # server-side rendering / SQL Server Reporting Services
