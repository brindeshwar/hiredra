name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # manual runs on any branch (used to verify the guards on throwaway branches)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, lint, safety guards
    # Windows: the owner's runtime and the desktop app's target platform.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.10"
          python-version: "3.12"
          enable-cache: true
      - name: Install from uv.lock
        run: uv sync --frozen
      - name: Format check
        run: uv run ruff format --check .
      - name: Lint (syntax errors and real bugs only)
        run: uv run ruff check .
      - name: Safety guards (G-a playwright imports, G-b POST/PUT, G-c mail/messaging)
        run: uv run python scripts/ci_guards.py
      - name: Tests
        run: uv run pytest -q

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, so a secret in any past commit is found
      - name: gitleaks (MIT CLI, official image)
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -v "${{ github.workspace }}:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --verbose --exit-code 1
