name: Bug
description: Something is broken.
title: "Bug: "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Redact personal data** before pasting logs: no profile content, contact details, ratings, cookies or keys.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What was expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The command or steps, and the stage (sourcing, funnel, extraction, graph, scoring, app, ...).
  - type: textarea
    id: logs
    attributes:
      label: Logs (redacted)
      render: text
