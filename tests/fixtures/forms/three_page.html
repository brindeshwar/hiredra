<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Test application form (three pages)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 32px auto; }
  fieldset { border: 1px solid #ccc; padding: 16px; margin-bottom: 16px; }
  label { display: block; margin: 10px 0 4px; }
  input[type=text], input[type=email], textarea, select { width: 100%; padding: 6px; }
  .hidden { display: none; }
  #log { margin-top: 20px; padding: 8px; background: #f3f3f3; }
</style>
</head>
<body>
<h1>Test application form</h1>
<p>A local fixture for the fill driver. Every submit event and every click on a final button is counted below; the
driver must leave both at 0.</p>
<form id="app" action="/never" method="post">
  <fieldset id="p1">
    <legend>Page 1 of 3: about you</legend>
    <label for="first_name">First name</label><input type="text" id="first_name" name="first_name">
    <label for="last_name">Last name</label><input type="text" id="last_name" name="last_name">
    <label for="email">Email</label><input type="email" id="email" name="email">
    <label for="phone">Phone</label><input type="text" id="phone" name="phone">
    <button type="button" class="next" data-to="p2">Next</button>
  </fieldset>
  <fieldset id="p2" class="hidden">
    <legend>Page 2 of 3: documents and links</legend>
    <label for="resume">Resume/CV</label><input type="file" id="resume" name="resume">
    <label for="linkedin">LinkedIn profile</label><input type="text" id="linkedin" name="linkedin">
    <label for="country">Country</label>
    <select id="country" name="country"><option value="">Choose</option><option>India</option><option>Germany</option></select>
    <label>Do you have a GitHub profile?</label>
    <label><input type="radio" name="has_github" value="Yes"> Yes</label>
    <label><input type="radio" name="has_github" value="No"> No</label>
    <button type="button" class="next" data-to="p3">Continue</button>
  </fieldset>
  <fieldset id="p3" class="hidden">
    <legend>Page 3 of 3: questions</legend>
    <label for="why">Why do you want to work here?</label><textarea id="why" name="why"></textarea>
    <label for="salary">Expected salary</label><input type="text" id="salary" name="salary">
    <label><input type="checkbox" name="consent" value="yes"> I agree to the privacy policy</label>
    <div class="final">
      <button type="submit" id="submit">Submit application</button>
      <button type="button" id="apply">Apply now</button>
      <button type="button" id="finish">Finish</button>
    </div>
  </fieldset>
</form>
<div id="log">submits: <span id="submits">0</span>, final clicks: <span id="finals">0</span></div>
<script>
  window.__submits = 0; window.__finals = 0;
  const form = document.getElementById('app');
  form.addEventListener('submit', (e) => { e.preventDefault(); window.__submits++; document.getElementById('submits').textContent = window.__submits; });
  for (const id of ['submit', 'apply', 'finish']) {
    document.getElementById(id).addEventListener('click', () => { window.__finals++; document.getElementById('finals').textContent = window.__finals; });
  }
  for (const b of document.querySelectorAll('button.next')) {
    b.addEventListener('click', () => { b.closest('fieldset').classList.add('hidden'); document.getElementById(b.dataset.to).classList.remove('hidden'); });
  }
</script>
</body>
</html>
